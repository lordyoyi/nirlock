[package]
name = "nirlock-vision"
description = "nirlock: YuNet decode/NMS, 5-point alignment, AuraFace/SFace embedding via ONNX Runtime"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
# Same crate/version `ort` already pulls in; used once, to read
# `OrtGetApiBase()->GetVersionString()` (runtime::version).
libloading = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["pnm"] }

# Measurement tool (DESIGN §9.1 folds it into `nirlockctl bench` in M3).
# Prefixed so that `cargo install` never drops a generic `bench` into PATH.
[[bin]]
name = "nirlock-bench"
path = "src/bin/bench.rs"

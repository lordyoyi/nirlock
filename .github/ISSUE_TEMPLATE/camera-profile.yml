name: Add a camera
description: Report what `nirlockctl probe` measured on your laptop — working or not
title: "camera: <laptop model> (<vendor:product>)"
labels: ["camera"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you — this is the most useful thing you can send, and that is
        true whether or not your camera works.

        Everything below comes from one command, `nirlockctl probe`. If you
        have not built nirlock yet, `cargo build --release` and then
        `NIRLOCK_HW_DIRS=hw target/release/nirlockctl probe` is enough. No
        install, no root, about two seconds — during which the camera light
        comes on, because measuring the emitter means streaming it.

  - type: input
    id: laptop
    attributes:
      label: Laptop model
      description: The exact model, as precisely as you can. This is what the next person searches for.
      placeholder: ASUS Zenbook UX3405CA
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: Output of `nirlockctl probe`
      description: |
        Paste it whole, including the `strobe:` line and the verdict. Do not
        trim it: the node layout is the profile, and the strobe line is the
        measurement that decides whether the camera can work at all.

        **Send this even if the verdict is "cannot be used".** A recorded
        negative saves the next person with your laptop an evening.
      render: text
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: "`uname -r`. The per-frame illumination metadata needs 6.17 or newer."
      placeholder: "6.17.4-arch1-1"
    validations:
      required: true

  - type: dropdown
    id: verified
    attributes:
      label: Did you verify the profile?
      description: |
        A profile that parses but does not work is worse than none: it is
        advertised as supported and sends the next person to debug a file we
        generated. "Not yet" is a perfectly good answer — say so and we will
        treat it as a lead rather than a profile.
      options:
        - "Yes — I installed it, enrolled, and unlocked my screen with my face"
        - "Partly — the daemon starts and sees the camera, but I have not unlocked with it"
        - "Not yet — probe says it should work, but I have not tried"
    validations:
      required: true

  - type: textarea
    id: profile
    attributes:
      label: The profile itself
      description: "From `nirlockctl probe --toml`. Correct the `id` to your laptop model, and the `fps` if you checked it with `v4l2-ctl --list-formats-ext`."
      render: toml

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: |
        Unlock times, whether it needed `--rgb`, anything that behaved
        differently from the README. Negative results are welcome: a camera
        that cannot work is worth recording so nobody repeats the attempt.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/lordyoyi/nirlock"

[workspace.dependencies]
nirlock-wire = { path = "crates/nirlock-wire" }
nirlock-cam = { path = "crates/nirlock-cam" }
nirlock-vision = { path = "crates/nirlock-vision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
libc = "0.2"
toml = "0.9"

# Mechanical enforcement of the HARD RULES (DESIGN §9.1): every `unsafe`
# block carries a SAFETY comment, no `unwrap` in library/daemon paths
# (tests and the bench binary are exempt via clippy.toml / per-file allows),
# and `unsafe fn` bodies spell out their own unsafe blocks. Crates that need
# no unsafe at all add `#![forbid(unsafe_code)]`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
